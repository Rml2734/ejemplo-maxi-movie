name: maxi-movie

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: maximovie
      POSTGRES_USER: maximovie
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maximovie -d maximovie"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Necesario si publicas la app detrás de un proxy inverso (Caddy, Nginx, Cloudflare)
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__MovieDbContext: "Host=db;Port=5432;Database=maximovie;Username=maximovie;Password=${DB_PASSWORD};SSL Mode=Disable"
      AdminCredentials__Email: ${ADMIN_EMAIL:-admin@admin.com}
      AdminCredentials__Password: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SmtpSettings__User: ${SMTP_USER:-}
      SmtpSettings__Password: ${SMTP_PASSWORD:-}
    volumes:
      - uploads:/app/wwwroot/uploads
    networks:
      - interna

networks:
  interna:

volumes:
  pgdata:
  uploads:
